    <g fill="#666666">
      <polygon points="887,174 899,168 899,180"/>
      <polygon points="887,246 899,240 899,252"/>
      <polygon points="887,318 899,312 899,324"/>
      <polygon points="887,390 899,384 899,396"/>
      <polygon points="887,462 899,456 899,468"/>
