<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
  <title id="title">Marc de Steinitz: sis models i tres iteracions</title>
  <desc id="desc">Les sis files són representació, procés, avaluació, canvi, impacte i decisió. Les tres fletxes recorren el marc avall per comprendre el lloc, amunt per dissenyar els mètodes, i avall per executar l'estudi. Hi ha participació de les persones del lloc i retorns per revisar el treball.</desc>
  <rect width="1000" height="780" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="22" fill="#222222">
    <rect x="28" y="22" width="405" height="72" rx="7" fill="#f5f3ed" stroke="#666666"/>
    <text x="230" y="52" text-anchor="middle" font-weight="bold">Equip i persones del lloc</text>
    <text x="230" y="80" text-anchor="middle" font-size="20">Objectius, coneixement i perspectives</text>
    <text x="640" y="54" text-anchor="middle" fill="#003366" font-weight="bold">1</text>
    <text x="738" y="54" text-anchor="middle" fill="#990000" font-weight="bold">2</text>
    <text x="836" y="54" text-anchor="middle" fill="#39734d" font-weight="bold">3</text>
    <g font-size="18" text-anchor="middle">
      <text x="640" y="83" fill="#003366">Entendre</text><text x="640" y="107" fill="#003366">el lloc</text>
      <text x="738" y="83" fill="#990000">Dissenyar</text><text x="738" y="107" fill="#990000">el mètode</text>
      <text x="836" y="83" fill="#39734d">Executar</text><text x="836" y="107" fill="#39734d">l'estudi</text>
    </g>
    <g stroke="#d4dce3" fill="#edf3f8">
      <rect x="318" y="145" width="564" height="58" rx="5"/>
      <rect x="318" y="217" width="564" height="58" rx="5"/>
      <rect x="318" y="289" width="564" height="58" rx="5"/>
    </g>
    <g stroke="#d5dfd5" fill="#edf4ee">
      <rect x="318" y="361" width="564" height="58" rx="5"/>
      <rect x="318" y="433" width="564" height="58" rx="5"/>
      <rect x="318" y="505" width="564" height="58" rx="5"/>
    </g>
    <g font-size="21">
      <text x="28" y="182">Com es descriu el lloc?</text>
      <text x="28" y="254">Com funciona?</text>
      <text x="28" y="311">Funciona</text>
      <text x="28" y="336">satisfactòriament?</text>
      <text x="28" y="398">Què es podria canviar?</text>
      <text x="28" y="470">Quins efectes tindria?</text>
      <text x="28" y="542">Quin canvi es prefereix?</text>
    </g>
    <g font-weight="bold">
      <text x="338" y="183">1 · Representació</text>
      <text x="338" y="255">2 · Procés</text>
      <text x="338" y="327">3 · Avaluació</text>
      <text x="338" y="399">4 · Canvi</text>
      <text x="338" y="471">5 · Impacte</text>
      <text x="338" y="543">6 · Decisió</text>
    </g>
    <path d="M640 145 V576" fill="none" stroke="#003366" stroke-width="5"/>
    <polygon points="628,575 652,575 640,595" fill="#003366"/>
    <path d="M738 582 V153" fill="none" stroke="#990000" stroke-width="5"/>
    <polygon points="726,154 750,154 738,134" fill="#990000"/>
