    <polygon points="732,604 744,604 738,592" fill="#666666"/>
    <path d="M738 127 V119 H836 V127" fill="none" stroke="#666666" stroke-width="2"/>
    <polygon points="830,126 842,126 836,137" fill="#666666"/>
