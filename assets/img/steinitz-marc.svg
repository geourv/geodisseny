    <polygon points="28,59 17,53 17,65" fill="#666666"/>
    <path d="M650 672 H916 V587" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="500" y="738" text-anchor="middle" font-size="20">Revisar dades, mètodes, alternatives o escala quan sigui necessari</text>
  </g>
</svg>
